# 构建系统:用 setuptools 打包
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 项目元数据
[project]
name = "vlmdeploy"
version = "0.7.0"
description = "Qwen2-VL-2B 两栈部署:TensorRT-LLM GPU / OpenVINO GenAI CPU 的首字延迟分解、量化与实测对照"
readme = "README.md"
requires-python = ">=3.12"
# 基础依赖只有这两个,公共库靠它们加标准库就能导入;两条栈各自的重依赖放在下面的可选组里
dependencies = ["pyarrow>=15", "pillow>=10"]

[project.optional-dependencies]
# 两条栈的依赖互相隔离,分别装进两个 conda 环境;精确版本见 envs/*.sh 与 requirements-*.txt
# GPU 栈
gpu = ["tensorrt_llm==1.3.0rc18", "torch==2.10.0"]
dev = ["ruff>=0.6"]                   # 只做静态检查,装在哪个环境都行;入口是 make lint
# CPU 栈
cpu = ["openvino==2026.4.1", "openvino-genai==2026.4.1.0", "openvino-tokenizers==2026.4.1.0", "nncf==3.4.0",
       "optimum-intel"]

# 只打包 vlmdeploy 这一个包
[tool.setuptools]
packages = ["vlmdeploy"]

# ruff 的行宽和目标 Python 版本
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E / F / W 基本错误与告警,I 导入排序,UP 现代语法,B 常见 bug,D docstring,ANN 类型注解,RUF100 失效的 noqa
select = ["E", "F", "W", "I", "UP", "B", "D", "ANN", "RUF100"]
ignore = [
    "D100", "D104", "D105", "D107",   # 模块 / 包 / 魔术方法 / __init__ 的 docstring 不强制
    "D203", "D213",                   # 与 D211 / D212 互斥
    "D400", "D415",                   # 中文 docstring 不要求英文句点
]

[tool.ruff.lint.pydocstyle]
convention = "google"                # docstring 用 Google 风格的 Args / Returns / Raises 小节

# 按目录放宽的规则
[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]                # 脚本需先改 sys.path 再 import
# 工具脚本同样先改 sys.path 再 import
"tools/*" = ["E402"]
"tests/*" = ["D", "ANN"]              # 测试不强制 docstring 与类型注解
